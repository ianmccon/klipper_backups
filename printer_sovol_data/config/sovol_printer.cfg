# [gcode_macro BED_MESH_CALIBRATE]
# rename_existing: BTT_BED_MESH_CALIBRATE
# gcode:
#   BTT_BED_MESH_CALIBRATE METHOD=rapid_scan

[gcode_macro FULL_BED_MESH]
description: Clear bed mesh, home all axes, and run a fresh bed mesh calibration
gcode:
    BED_MESH_CLEAR
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default


#====================================================================
# KLIPPER SCREEN
#====================================================================

[virtual_sdcard]
path: /home/ian/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
#[display_status]
#[pause_resume]

#====================================================================
# X STEPPER
#====================================================================
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_min: 0
position_max: 233
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
diag_pin:^gpio4
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 0
sense_resistor: 0.150
interpolate: False
driver_SGTHRS: 100

#====================================================================
# Y STEPPER
#====================================================================
[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: -24
position_min: -24
position_max: 205
homing_speed: 40

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
diag_pin: ^gpio3
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 2
sense_resistor: 0.150
interpolate: False   
driver_SGTHRS: 100

#====================================================================
# Z STEPPER
#====================================================================
[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 258
position_min: -2.5
homing_speed: 4

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
diag_pin:^gpio3
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 1
sense_resistor: 0.150
interpolate: False

#====================================================================
# EXTRUDER
#====================================================================
[extruder]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
rotation_distance: 4.588411160722498
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_distance: 500
#max_extrude_only_velocity: 30 or 60 / 120
#max_extrude_only_accel: 600 or 800
pressure_advance: 0.1 
pressure_advance_smooth_time: 0.02 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_pin: gpio27
sensor_type: Generic 3950
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 270
max_power: 0.5

# sensor_type: MAX31865
# sensor_pin: EBBCan: PA4
# spi_bus: spi1
# rtd_nominal_r: 100
# rtd_reference_r: 430
# rtd_num_of_wires: 2

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.85
hold_current: 0.1
stealthchop_threshold: 0

#====================================================================
# HEATED BED
#====================================================================

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
#control: pid
#pid_kp: 64.440
#pid_ki: 0.773
#pid_kd: 1343.571
min_temp: 0
max_temp: 130

#====================================================================
# BED SCREWS
#====================================================================
[bed_screws]
screw1_name: front left
screw1: 26.5, 31
screw2_name: front right
screw2: 196.75, 31
screw3_name: back right
screw3: 196.75, 201
screw4_name: back left
screw4: 26.5, 201

#====================================================================
# SCREW TILT ADJUST
#====================================================================
[screws_tilt_adjust]
screw1_name: center
screw1: 84.50, 135
screw2_name: front left
screw2: 0, 51
screw3_name: front right
screw3: 169.75, 51
screw4_name: back right
screw4: 169.75, 221
screw5_name: back left
screw5: 0, 221
horizontal_move_z: 10

[probe]
pin: gpio22
x_offset: 27
y_offset: -20
#z_offset: 0
samples: 3
samples_result: median
samples_tolerance: 0.01
samples_tolerance_retries: 5


#====================================================================
# FANS
#====================================================================

# [controller_fan mainboard_fan]
# pin: PC7
# idle_timeout: 60
# fan_speed: 1.0

[fan]
pin: gpio17


[heater_fan heatbreak_cooling_fan]
pin: gpio18


[heater_fan controller_fan]
pin: gpio20

#====================================================================
# SAFE Z HOME
#====================================================================
[safe_z_home]
home_xy_position: 84.50,135
z_hop: 10
z_hop_speed: 5
speed: 100.0

#====================================================================
# BED MESH
#====================================================================
[bed_mesh]
speed: 175
mesh_min: 27, 6
mesh_max: 222, 203
probe_count: 7,7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

