#=====================================================
# MACROS
#=====================================================
[gcode_macro POOPY]
gcode:
  SAVE_GCODE_STATE NAME=poopy
  G0 X4 Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  RESTORE_GCODE_STATE NAME=poopy


[gcode_macro PRINT_START]
gcode:
   {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
  
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}

  {% set startX = printer.configfile.settings.safe_z_home.home_xy_position[0]|float %}
  {% set startY = printer.configfile.settings.safe_z_home.home_xy_position[1]|float %}

  G90
  G1 X{startX} Y{startY} F10000

  M140 S{ target_bed } ; set bed temp
  M190 S{ target_bed } ; wait for bed temp

  BED_MESH_CALIBRATE

  G1 Z0.6 X40 Y4 F2000.06

  M104 S{ target_extruder } ; set extruder temp
  M109  S{ target_extruder } 

  POOPY

[gcode_macro PRINT_END]
gcode:
    M400                    ; wait for current moves
    G92 E0                  ; reset extruder position
    G1 E-4.0 F1800          ; retract filament slower

    G91                     ; relative positioning
    G0 Z10 F1200            ; lift nozzle slowly
    G4 P500                 ; wait 0.5 seconds

    G90                     ; absolute positioning
    G0 X223 F3000           ; move to right side slower
    G0 Y{printer.configfile.config["stepper_y"]["position_max"]|float - 10} F3000

    TURN_OFF_HEATERS
    M107


[gcode_macro M601] 
gcode: 
  pause

[gcode_macro LEVEL_BED_SCREWS]
description: Calculate the required adjustment of screws to level bed.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z10 F600
    M400

    SCREWS_TILT_CALCULATE

[gcode_macro Z_OFFSET]
gcode:
  G28
  PROBE_CALIBRATE

[gcode_macro Z_OFFSET_SAVE]
gcode:
  SAVE_CONFIG

[gcode_macro PARK_CENTER]
description: Home if needed, then move to centre at Z=7.5mm
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z10 F600
    M400

    G1 X113 Y102 F6000
    G1 Z7.5 F600

[gcode_macro DISABLE_MOTORS]
description: Temporarily disable all motors.
gcode:
      M18

[gcode_macro SHOW_COORDINATES]
description: Show the coordinates of all axis.
gcode:
      M114

[gcode_macro GANTRY_LEVEL]
description: Home if needed, then move X and Y to center, and Z to 18.1 (to allow for manual gantry level.)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z10 F600
    M400

    G1 X113 Y102 F6000
    G1 Z18.1 F600

    M18

