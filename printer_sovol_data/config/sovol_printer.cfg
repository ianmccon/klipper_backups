[include fluidd.cfg]
[exclude_object]
[respond]

#====================================================================
# Serial Connection
#====================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4550357127901338-if00
restart_method: command

#[temperature_sensor SKR Mini]
#sensor_type: temperature_mcu

#[temperature_sensor Rasp. Pi]
#sensor_type: temperature_host

#[temperature_sensor EBB36]
#sensor_type: temperature_mcu
#sensor_mcu: EBBCan

#====================================================================
# PRINTER LIMIT SETTINGS
#====================================================================
[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 4500
max_z_velocity: 5
max_z_accel: 100


