[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
# endstop_pin: ^gpio4
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -20
position_min: -20
position_max: 235
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
diag_pin:^gpio4
driver_SGTHRS: 60
uart_address: 0
run_current: 0.7
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
# endstop_pin: ^gpio3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -8
position_min: -8
position_max: 208
homing_speed: 30

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
diag_pin: ^gpio3
driver_SGTHRS: 60
uart_address: 2
run_current: 0.8
stealthchop_threshold: 999999

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
# endstop_pin: ^gpio25
endstop_pin:probe:z_virtual_endstop
# position_endstop: 0.0
position_max: 250
position_min: -10
homing_speed: 5
second_homing_speed: 5
# homing_retract_dist: 1
# homing_positive: true

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.7
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
heater_pin: gpio23
sensor_pin: gpio27
microsteps: 16
rotation_distance: 28.893 #for 5mm Shaft Driven Bondtech gearsets
gear_ratio: 50:8 #for sherpa mini 8t motor
full_steps_per_rotation: 200 #1.8deg Motor
nozzle_diameter: 0.400
filament_diameter: 1.750

sensor_type: EPCOS 100K B57560G104F?

control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 260
pressure_advance = 0.35
max_extrude_only_distance: 120
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: gpio9
# tx_pin: gpio8
# uart_address: 3
run_current: 0.650
stealthchop_threshold: 0

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18


[heater_fan controller_fan]
pin: gpio20

[printer]
kinematics: cartesian
max_velocity: 10000
max_accel: 4500
max_z_velocity: 50
max_z_accel: 100

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4550357127901338-if00
restart_method: command