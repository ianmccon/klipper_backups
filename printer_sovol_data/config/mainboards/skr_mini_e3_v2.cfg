#====================================================================
# X STEPPER
#====================================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_min: 0
position_max: 233
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
diag_pin:^PC0
run_current: 0.86
stealthchop_threshold: 999999
uart_address: 0
sense_resistor: 0.150
interpolate: False
driver_SGTHRS: 100

#====================================================================
# Y STEPPER
#====================================================================
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -24
position_min: -24
position_max: 203
homing_speed: 40
homing_retract_dist: 0


[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
diag_pin: ^PC1
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 2
sense_resistor: 0.150
interpolate: False   
driver_SGTHRS: 100

#====================================================================
# Z STEPPER
#====================================================================
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 258
position_min: -2.5
homing_speed: 4

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
diag_pin:^PC2
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 1
sense_resistor: 0.150
interpolate: False


#====================================================================
# EXTRUDER - second z motor
#====================================================================
[stepper_z1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 64
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop


[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
diag_pin:^PC15
run_current: 0.8
stealthchop_threshold: 999999
uart_address: 3
sense_resistor: 0.150
interpolate: False

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: pid
pid_kp: 64.440
pid_ki: 0.773
pid_kd: 1343.571
min_temp: 0
max_temp: 130

[controller_fan my_controller_fan]
pin: PC6
max_power: 1.0
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 30
heater: extruder
stepper: stepper_x, stepper_y, stepper_z

# [heater_fan controller_fan]
# pin: gpio20
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_fan rpi_fan]
pin: PC7                     # Replace with your mainboard's fan PWM pin
sensor_type: temperature_host
min_temp: 10
max_temp: 85
target_temp: 55.0             # Target temperature in °C
max_delta: 3.0                # Turn fan on at 58°C, off at 52°C
control: watermark
[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1500
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5

[firmware_retraction]
retract_length: 3
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 20
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.


[mcu]
# USB
# serial: /dev/serial/by-id/usb-Klipper_rp2040_4550357127901338-if00
# serial: /dev/serial/by-id/usb-Klipper_rp2040_45503571288B53A8-if00
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_38FFD505304D593006760343-if00
# Serial
# serial: /dev/serial0

restart_method: command


[static_digital_output usb_pullup_enable]
pins: !PA14

# ============================================================
# Z TILT
# ============================================================

[z_tilt]

z_positions:
    30,117.5
    205,117.5

points:
    30,117.5
    205,117.5

speed: 100
horizontal_move_z: 5

retries: 5
retry_tolerance: 0.02